<!DOCTYPE html>
<html lang="en">
<head>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerraSpace — Sub-surface Resource Intelligence</title>

  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #06090e;
      --bg2:      #0b1219;
      --surface:  #101b26;
      --surface2: #141f2c;
      --border:   #1b3550;
      --accent:   #2196f3;
      --accent-l: #4dabf5;
      --accent-d: #1565c0;
      --text:     #cad6e2;
      --muted:    #5a798f;
      --dim:      #283d4f;
    }
    html { scroll-behavior: auto; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 64px; height: 84px;
      transition: background 0.35s, border-bottom 0.35s;
    }
    .nav.scrolled {
      background: rgba(6,9,14,0.97);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      display: flex; align-items: center; gap: 0;
      text-decoration: none; user-select: none;
    }
    .nav-logo img { height: 44px; object-fit: contain; display: block; }
    .nav-links { display: flex; gap: 0; list-style: none; }
    .nav-item { position: relative; }
    .nav-item > a {
      display: flex; align-items: center; gap: 5px;
      color: var(--muted); text-decoration: none;
      font-size: 13.5px; font-weight: 500; letter-spacing: 0.04em;
      padding: 0 16px; height: 84px;
      transition: color 0.2s;
    }
    .nav-item > a:hover, .nav-item > a.active { color: var(--text); }
    .nav-chevron { width: 10px; height: 10px; opacity: 0.5; flex-shrink: 0; }
    .nav-dropdown {
      position: absolute; top: 100%; left: 0;
      background: rgba(11,18,25,0.98);
      border: 1px solid var(--border);
      min-width: 200px;
      display: none; flex-direction: column;
      backdrop-filter: blur(16px);
    }
    .nav-item:hover .nav-dropdown { display: flex; }
    .nav-dropdown a {
      display: block; padding: 11px 20px;
      color: var(--muted); text-decoration: none;
      font-size: 13px; font-weight: 500; letter-spacing: 0.03em;
      transition: color 0.18s, background 0.18s;
      white-space: nowrap;
    }
    .nav-dropdown a:hover { color: var(--text); background: rgba(74,143,181,0.07); }
    .btn-cta {
      background: var(--accent); color: #fff;
      padding: 9px 22px; border: none; border-radius: 2px;
      font-family: 'Barlow', sans-serif; font-size: 13.5px; font-weight: 500;
      cursor: pointer; letter-spacing: 0.04em; text-decoration: none;
      transition: background 0.2s; white-space: nowrap;
    }
    .btn-cta:hover { background: var(--accent-l); }

    /* ── PAGES ── */
    .page { display: none; min-height: 100vh; }
    .page.active { display: block; }

    /* ── HERO ── */
    .hero {
      position: relative; min-height: 100vh;
      display: flex; align-items: center;
      padding: 130px 64px 80px;
      background-image: url('assets/hero_underground2.png');
      background-size: cover; background-position: center 38%;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(105deg, rgba(4,8,14,0.94) 48%, rgba(4,8,14,0.45) 100%);
    }
    .hero::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 160px;
      background: linear-gradient(to top, var(--bg), transparent);
    }
    .hero-content { position: relative; z-index: 1; max-width: 680px; }
    .eyebrow {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px; font-weight: 600; letter-spacing: 0.24em;
      color: var(--accent); text-transform: uppercase;
      margin-bottom: 22px;
      display: flex; align-items: center; gap: 12px;
    }
    .eyebrow::before { content: ''; width: 28px; height: 1px; background: var(--accent); flex-shrink: 0; }
    .hero h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(48px, 6.5vw, 84px);
      font-weight: 700; line-height: 1.0; color: #fff;
      margin-bottom: 26px; letter-spacing: -0.01em;
    }
    .hero h1 em { font-style: normal; color: var(--accent-l); }
    .hero-sub {
      font-size: 17.5px; color: var(--muted);
      line-height: 1.68; margin-bottom: 44px; max-width: 520px;
    }
    .hero-btns { display: flex; gap: 14px; flex-wrap: wrap; }
    .btn-primary {
      background: var(--accent); color: #fff;
      padding: 14px 32px; border: none; border-radius: 2px;
      font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 500;
      cursor: pointer; text-decoration: none; letter-spacing: 0.04em;
      transition: background 0.2s, transform 0.15s; display: inline-block;
    }
    .btn-primary:hover { background: var(--accent-l); transform: translateY(-1px); }
    .btn-ghost {
      background: transparent; color: var(--text);
      padding: 14px 32px; border: 1px solid var(--border); border-radius: 2px;
      font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 500;
      cursor: pointer; text-decoration: none; letter-spacing: 0.04em;
      transition: border-color 0.2s, color 0.2s; display: inline-block;
    }
    .btn-ghost:hover { border-color: var(--accent); color: #fff; }
    .hero-stats {
      display: flex; gap: 52px; margin-top: 64px;
      padding-top: 40px; border-top: 1px solid var(--border);
    }
    .stat-val {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 38px; font-weight: 700; color: #fff; line-height: 1;
    }
    .stat-val em { font-style: normal; color: var(--accent-l); font-size: 0.85em; }
    .stat-lbl { font-size: 14px; color: var(--muted); margin-top: 4px; }

    /* ── SHARED ── */
    .section-wrap { padding: 100px 64px; max-width: 1280px; margin: 0 auto; }
    .full-bleed { padding: 100px 0; }
    .full-bleed .section-wrap { padding-top: 0; padding-bottom: 0; }
    .bg2 { background: var(--bg2); }
    .sec-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13.5px; font-weight: 600; letter-spacing: 0.24em;
      color: var(--accent); text-transform: uppercase; margin-bottom: 14px;
    }
    .sec-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(30px, 3.8vw, 50px); font-weight: 700;
      color: #fff; line-height: 1.08; margin-bottom: 18px;
    }
    .sec-body {
      font-size: 16.5px; color: var(--muted);
      max-width: 600px; line-height: 1.72;
    }

    /* ── PROBLEM ── */
    .problem-grid {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 2px; margin: 56px 0 2px;
    }
    .prob-card {
      background: var(--surface); padding: 40px 34px;
      border-top: 2px solid var(--accent-d);
      transition: border-top-color 0.2s;
    }
    .prob-card:hover { border-top-color: var(--accent); }
    .prob-icon { width: 36px; height: 36px; color: var(--accent); margin-bottom: 18px; }
    .prob-card h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 21px; font-weight: 700; color: #fff; margin-bottom: 10px;
    }
    .prob-card p { font-size: 14.5px; color: var(--muted); line-height: 1.65; }
    .problem-quote {
      background: var(--surface2); border-left: 3px solid var(--accent);
      padding: 28px 36px;
    }
    .problem-quote p { font-size: 16px; color: var(--text); line-height: 1.72; font-style: italic; }

    /* ── SOLUTION ── */
    .solution-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 80px; align-items: center;
    }
    .sol-img { background: var(--surface); border-radius: 4px; overflow: hidden; }
    .sol-img img { width: 100%; display: block; }
    .sol-img-caption {
      padding: 16px 20px; font-size: 13.5px; color: var(--muted);
      border-top: 1px solid var(--border); letter-spacing: 0.02em;
    }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0; }
    .tag {
      background: var(--surface2); border: 1px solid var(--accent-d);
      color: var(--accent-l); padding: 5px 13px; border-radius: 2px;
      font-size: 13px; font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .moon-card {
      margin-top: 72px; background: var(--surface);
      border-left: 3px solid var(--accent); padding: 44px 48px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 48px;
    }
    .moon-card h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 12px;
    }
    .moon-card p { font-size: 15px; color: var(--muted); line-height: 1.7; }

    /* ── BENEFITS ── */
    .benefits-grid {
      display: grid; grid-template-columns: repeat(2,1fr);
      gap: 2px; margin-top: 56px;
    }
    .ben-card {
      background: var(--surface); padding: 38px 34px;
      display: flex; gap: 22px; align-items: flex-start;
    }
    .ben-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 52px; font-weight: 700; color: var(--dim);
      line-height: 1; flex-shrink: 0;
    }
    .ben-card h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 8px;
    }
    .ben-card p { font-size: 14.5px; color: var(--muted); line-height: 1.63; }

    /* ── TEAM ── */
    .team-intro { max-width: 700px; }
    .team-section-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px; font-weight: 600; letter-spacing: 0.18em;
      color: var(--accent); text-transform: uppercase;
      margin: 60px 0 24px; padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .team-grid {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 2px; margin-bottom: 4px;
    }
    .team-grid-2 { grid-template-columns: repeat(2,1fr); max-width: 900px; }
    .team-card {
      background: var(--surface); overflow: hidden;
      position: relative;
    }
    .team-card:hover .team-overlay { opacity: 1; }
    .team-photo {
      width: 100%; aspect-ratio: 1 / 1;
      object-fit: cover; object-position: center 30%;
      display: block; filter: grayscale(0.15);
      transition: filter 0.3s;
      overflow: hidden;
    }
    .team-card { overflow: hidden; }
    .team-card:hover .team-photo { filter: grayscale(0.5); }
    .team-info { padding: 26px 28px; }
    .team-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px; font-weight: 700; color: #fff;
    }
    .team-role {
      font-size: 12.5px; color: var(--accent-l);
      font-weight: 500; margin: 4px 0 12px; letter-spacing: 0.04em;
    }
    .team-bio { font-size: 13.5px; color: var(--muted); line-height: 1.65; }
    .team-overlay {
      position: absolute; inset: 0;
      background: rgba(6,9,14,0.97);
      padding: 32px 28px;
      display: flex; flex-direction: column; justify-content: center;
      opacity: 0; transition: opacity 0.26s;
    }
    .team-overlay-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px; font-weight: 700;
      color: var(--accent-l); margin-bottom: 12px;
    }
    .team-overlay p { font-size: 13.5px; color: var(--text); line-height: 1.72; }

    /* ── PARTNERS ── */
    .partners-section {
      padding: 36px 0;
      background: #ffffff;
      overflow: hidden;
    }
    .partners-label {
      text-align: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13.5px; font-weight: 600;
      letter-spacing: 0.24em; color: #6a7a8a;
      text-transform: uppercase; margin-bottom: 24px;
    }
    .logo-scroll { overflow: hidden; position: relative; }
    .logo-track {
      display: flex; align-items: center; gap: 56px;
      width: max-content;
      animation: scroll-logos 50s linear infinite;
    }
    .logo-track:hover { animation-play-state: paused; }
    .logo-track a {
      display: flex; align-items: center;
      flex-shrink: 0; line-height: 0;
      transition: transform 0.2s;
    }
    .logo-track a:hover { transform: scale(1.06); }
    .logo-track img {
      height: 64px; max-width: 200px; opacity: 1;
      transition: opacity 0.2s;
      flex-shrink: 0; object-fit: contain;
      background: transparent; padding: 0;
    }
    @keyframes scroll-logos {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ── CONTACT ── */
    .contact-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 80px; align-items: start;
    }
    .contact-email { font-size: 15px; color: var(--accent-l); margin-top: 22px; }
    .cta-cards { display: flex; flex-direction: column; gap: 16px; }
    .cta-card {
      background: var(--surface); border: 1px solid var(--border);
      padding: 30px 32px; border-radius: 3px;
      display: flex; flex-direction: column; gap: 10px;
      transition: border-color 0.2s;
    }
    .cta-card:hover { border-color: var(--accent-d); }
    .cta-card-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px; font-weight: 700; color: #fff;
    }
    .cta-card-desc { font-size: 14px; color: var(--muted); line-height: 1.6; }
    .cta-card .btn-primary,
    .cta-card .btn-ghost { align-self: flex-start; margin-top: 6px; font-size: 14px; padding: 10px 24px; }

    /* ── PAGE HEADER (inner pages) ── */
    .page-header {
      padding: 140px 64px 72px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      position: relative; overflow: hidden;
    }
    .page-header.underground {
      background-image: url('assets/hero_underground2.png');
      background-size: cover; background-position: center 40%;
    }
    .page-header.underground::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(105deg, rgba(4,8,14,0.91) 50%, rgba(4,8,14,0.55) 100%);
      pointer-events: none;
    }
    .page-header.space {
      background-image: url('assets/hero_space.jpg');
      background-size: cover; background-position: center center;
    }
    .page-header.space::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(105deg, rgba(4,8,14,0.88) 50%, rgba(4,8,14,0.55) 100%);
      pointer-events: none;
    }
    .page-header:not(.underground):not(.space)::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 70% 50%, rgba(74,143,181,0.06), transparent);
      pointer-events: none;
    }
    .page-header .eyebrow { margin-bottom: 16px; position: relative; z-index: 1; }
    .page-header .sec-title { font-size: clamp(36px,5vw,64px); margin-bottom: 0; position: relative; z-index: 1; }

    /* ── ABOUT PAGE ── */
    .about-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 80px; align-items: start;
    }
    .about-quote {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px; font-weight: 600;
      color: #fff; line-height: 1.25;
      border-left: 3px solid var(--accent);
      padding-left: 28px; margin: 48px 0;
    }
    .timeline { margin-top: 48px; }
    .tl-item {
      display: grid; grid-template-columns: 28px 1fr;
      gap: 20px; margin-bottom: 32px; align-items: start;
    }
    .tl-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent); margin-top: 6px;
      box-shadow: 0 0 0 4px rgba(74,143,181,0.15);
    }
    .tl-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14.5px; font-weight: 600; letter-spacing: 0.12em;
      color: var(--accent); text-transform: uppercase; margin-bottom: 4px;
    }
    .tl-body { font-size: 15px; color: var(--muted); line-height: 1.65; }

    /* ── SOLUTIONS PAGE ── */
    .use-case-grid {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 2px; margin-top: 48px;
    }
    .use-case-card {
      background: var(--surface); padding: 36px 28px;
      border-top: 2px solid var(--accent-d);
      transition: border-top-color 0.2s;
    }
    .use-case-card:hover { border-top-color: var(--accent); }
    .use-case-icon { width: 32px; height: 32px; color: var(--accent); margin-bottom: 16px; }
    .use-case-card h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 10px;
    }
    .use-case-card p { font-size: 14px; color: var(--muted); line-height: 1.65; }

    /* ── FOOTER ── */
    .footer {
      background: var(--bg); border-top: 1px solid var(--border);
      padding: 36px 64px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-logo img { height: 32px; opacity: 0.6; object-fit: contain; }
    .footer-logo { cursor: pointer; }
    .footer-copy { font-size: 13.5px; color: var(--dim); }
    .footer-links { display: flex; gap: 24px; align-items: center; }
    .footer-links a { font-size: 13.5px; color: var(--dim); text-decoration: none; cursor: pointer; transition: color 0.2s; display: inline-flex; align-items: center; }
    .footer-links a:hover { color: var(--muted); }
    .footer-social { display: flex; gap: 14px; align-items: center; margin-left: 4px; }
    .footer-social a { color: var(--dim); display: inline-flex; align-items: center; justify-content: center; transition: color 0.2s; }
    .footer-social a:hover { color: var(--muted); }
    .footer-social svg { width: 16px; height: 16px; display: block; fill: currentColor; }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .nav { padding: 0 16px; height: 64px; gap: 12px; }
      .nav-logo img { height: 26px; max-width: 55vw; }
      .nav-links { display: none; }
      .btn-cta { padding: 8px 14px; font-size: 12.5px; flex-shrink: 0; }
      .hero, .page-header { padding-left: 24px; padding-right: 24px; }
      .section-wrap { padding: 60px 24px; }
      .problem-grid, .solution-grid, .benefits-grid,
      .team-grid, .team-grid-2, .contact-grid, .moon-card,
      .about-grid, .use-case-grid { grid-template-columns: 1fr; }
      .hero-stats { gap: 28px; flex-wrap: wrap; }
      .moon-card { padding: 28px 20px; }
      .footer { flex-direction: column; gap: 14px; padding: 24px; text-align: center; }
      .footer-links { justify-content: center; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── DATA ──────────────────────────────────────────────────────────────

  }
];

const ADVISORS = [
  {

// ── APP ──────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState("home");
  const [scrolled, setScrolled] = useState(false);
  const topRef = useRef(null);

  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 56);
    window.addEventListener("scroll", h, { passive: true });
    return () => window.removeEventListener("scroll", h);
  }, []);

  function goTo(p) {
    setPage(p);
    // scroll to top of page
    window.scrollTo({ top: 0 });
  }

  return (
    <div ref={topRef}>
      <Nav page={page} goTo={goTo} scrolled={scrolled} />
      {page === "home"      && <HomePage goTo={goTo} />}
      {page === "about"     && <AboutPage goTo={goTo} />}
      {page === "team"      && <TeamPage goTo={goTo} />}
      {page === "solutions" && <SolutionsPage goTo={goTo} />}
      {page === "contact"   && <ContactPage goTo={goTo} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
