  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #06090e;
      --bg2:      #0b1219;
      --surface:  #101b26;
      --surface2: #141f2c;
      --border:   #1b2d3e;
      --accent:   #4a8fb5;
      --accent-l: #6aafd4;
      --accent-d: #1b4a66;
      --text:     #d4e0ea;
      --muted:    #94aec2;
      --dim:      #5a7d94;
    }
    html { scroll-behavior: auto; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 64px; height: 72px;
      transition: background 0.35s, border-bottom 0.35s;
    }
    .nav.scrolled {
      background: rgba(6,9,14,0.97);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      display: flex; align-items: center; gap: 0;
      text-decoration: none; user-select: none;
    }
    .nav-logo img { height: 36px; width: auto; }
    .nav-links { display: flex; gap: 0; list-style: none; }
    .nav-item { position: relative; }
    .nav-item > a {
      display: flex; align-items: center; gap: 5px;
      color: var(--muted); text-decoration: none;
      font-size: 13.5px; font-weight: 500; letter-spacing: 0.04em;
      padding: 0 16px; height: 72px;
      transition: color 0.2s;
    }
    .nav-item > a:hover, .nav-item > a.active { color: var(--text); }
    .nav-chevron { width: 10px; height: 10px; opacity: 0.5; flex-shrink: 0; }
    .nav-dropdown {
      position: absolute; top: 100%; left: 0;
      background: rgba(11,18,25,0.98);
      border: 1px solid var(--border);
      min-width: 200px;
      display: none; flex-direction: column;
      backdrop-filter: blur(16px);
    }
    .nav-item:hover .nav-dropdown { display: flex; }
    .nav-dropdown a {
      display: block; padding: 11px 20px;
      color: var(--muted); text-decoration: none;
      font-size: 13px; font-weight: 500; letter-spacing: 0.03em;
      transition: color 0.18s, background 0.18s;
      white-space: nowrap;
    }
    .nav-dropdown a:hover { color: var(--text); background: rgba(74,143,181,0.07); }
    .btn-cta {
      background: var(--accent); color: #fff;
      padding: 9px 22px; border: none; border-radius: 2px;
      font-family: 'Barlow', sans-serif; font-size: 13.5px; font-weight: 500;
      cursor: pointer; letter-spacing: 0.04em; text-decoration: none;
      transition: background 0.2s; white-space: nowrap;
    }
    .btn-cta:hover { background: var(--accent-l); }

    /* ── PAGES ── */
    .page { display: none; min-height: 100vh; }
    .page.active { display: block; }

    /* ── HERO ── */
    .hero {
      position: relative; min-height: 100vh;
      display: flex; align-items: center;
      padding: 130px 64px 80px;
      background-image: url("assets/hero_underground2.png");
      background-size: cover; background-position: center 38%;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(105deg, rgba(4,8,14,0.94) 48%, rgba(4,8,14,0.45) 100%);
    }
    .hero::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 160px;
      background: linear-gradient(to top, var(--bg), transparent);
    }
    .hero-content { position: relative; z-index: 1; max-width: 680px; }
    .eyebrow {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px; font-weight: 600; letter-spacing: 0.24em;
      color: var(--accent); text-transform: uppercase;
      margin-bottom: 22px;
      display: flex; align-items: center; gap: 12px;
    }
    .eyebrow::before { content: ''; width: 28px; height: 1px; background: var(--accent); flex-shrink: 0; }
    .hero h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(48px, 6.5vw, 84px);
      font-weight: 700; line-height: 1.0; color: #fff;
      margin-bottom: 26px; letter-spacing: -0.01em;
    }
    .hero h1 em { font-style: normal; color: var(--accent-l); }
    .hero-sub {
      font-size: 17.5px; color: var(--muted);
      line-height: 1.68; margin-bottom: 44px; max-width: 520px;
    }
    .hero-btns { display: flex; gap: 14px; flex-wrap: wrap; }
    .btn-primary {
      background: var(--accent); color: #fff;
      padding: 14px 32px; border: none; border-radius: 2px;
      font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 500;
      cursor: pointer; text-decoration: none; letter-spacing: 0.04em;
      transition: background 0.2s, transform 0.15s; display: inline-block;
    }
    .btn-primary:hover { background: var(--accent-l); transform: translateY(-1px); }
    .btn-ghost {
      background: transparent; color: var(--text);
      padding: 14px 32px; border: 1px solid var(--border); border-radius: 2px;
      font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 500;
      cursor: pointer; text-decoration: none; letter-spacing: 0.04em;
      transition: border-color 0.2s, color 0.2s; display: inline-block;
    }
    .btn-ghost:hover { border-color: var(--accent); color: #fff; }
    .hero-stats {
      display: flex; gap: 52px; margin-top: 64px;
      padding-top: 40px; border-top: 1px solid var(--border);
    }
    .stat-val {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 38px; font-weight: 700; color: #fff; line-height: 1;
    }
    .stat-val em { font-style: normal; color: var(--accent-l); font-size: 0.85em; }
    .stat-lbl { font-size: 13px; color: var(--muted); margin-top: 4px; }

    /* ── SHARED ── */
    .section-wrap { padding: 100px 64px; max-width: 1280px; margin: 0 auto; }
    .full-bleed { padding: 100px 0; }
    .full-bleed .section-wrap { padding-top: 0; padding-bottom: 0; }
    .bg2 { background: var(--bg2); }
    .sec-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11.5px; font-weight: 600; letter-spacing: 0.24em;
      color: var(--accent); text-transform: uppercase; margin-bottom: 14px;
    }
    .sec-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(30px, 3.8vw, 50px); font-weight: 700;
      color: #fff; line-height: 1.08; margin-bottom: 18px;
    }
    .sec-body {
      font-size: 16.5px; color: var(--muted);
      max-width: 600px; line-height: 1.72;
    }
    a { color: var(--accent-l); }
    a:hover { color: #fff; }
    .brand-name { font: inherit; letter-spacing: inherit; }

    /* ── PROBLEM ── */
    .problem-grid {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 2px; margin: 56px 0 2px;
    }
    .prob-card {
      background: var(--surface); padding: 40px 34px;
      border-top: 2px solid var(--accent-d);
      transition: border-top-color 0.2s;
    }
    .prob-card:hover { border-top-color: var(--accent); }
    .prob-icon { width: 36px; height: 36px; color: var(--accent); margin-bottom: 18px; }
    .prob-card h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 21px; font-weight: 700; color: #fff; margin-bottom: 10px;
    }
    .prob-card p { font-size: 14.5px; color: var(--muted); line-height: 1.65; }
    .problem-quote {
      background: var(--surface2); border-left: 3px solid var(--accent);
      padding: 28px 36px;
    }
    .problem-quote p { font-size: 16px; color: var(--text); line-height: 1.72; font-style: italic; }

    /* ── SOLUTION ── */
    .solution-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 80px; align-items: center;
    }
    .sol-img { background: var(--surface); border-radius: 4px; overflow: hidden; }
    .sol-img img { width: 100%; display: block; }
    .sol-img-caption {
      padding: 16px 20px; font-size: 12px; color: var(--muted);
      border-top: 1px solid var(--border); letter-spacing: 0.02em;
    }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0; }
    .tag {
      background: var(--surface2); border: 1px solid var(--accent-d);
      color: var(--accent-l); padding: 5px 13px; border-radius: 2px;
      font-size: 11.5px; font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .moon-card {
      margin-top: 72px; background: var(--surface);
      border-left: 3px solid var(--accent); padding: 44px 48px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 48px;
    }
    .moon-card h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 12px;
    }
    .moon-card p { font-size: 15px; color: var(--muted); line-height: 1.7; }

    /* ── BENEFITS ── */
    .benefits-grid {
      display: grid; grid-template-columns: repeat(2,1fr);
      gap: 2px; margin-top: 56px;
    }
    .ben-card {
      background: var(--surface); padding: 38px 34px;
      display: flex; gap: 22px; align-items: flex-start;
    }
    .ben-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 52px; font-weight: 700; color: var(--dim);
      line-height: 1; flex-shrink: 0;
    }
    .ben-card h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 8px;
    }
    .ben-card p { font-size: 14.5px; color: var(--muted); line-height: 1.63; }

    /* ── TEAM ── */
    .team-intro { max-width: 700px; }
    .team-section-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px; font-weight: 600; letter-spacing: 0.18em;
      color: var(--dim); text-transform: uppercase;
      margin: 60px 0 24px; padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .team-grid {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 2px; margin-bottom: 4px;
    }
    .team-grid-2 { grid-template-columns: repeat(2,1fr); max-width: 900px; }
    .team-card {
      background: var(--surface); overflow: hidden;
      position: relative;
    }
    .team-card:hover .team-overlay { opacity: 1; }
    .team-photo {
      width: 100%; height: 280px;
      object-fit: cover; object-position: top center;
      display: block; filter: grayscale(0.15);
      transition: filter 0.3s;
    }
    .team-card:hover .team-photo { filter: grayscale(0.5); }
    .team-info { padding: 26px 28px; }
    .team-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px; font-weight: 700; color: #fff;
    }
    .team-role {
      font-size: 12.5px; color: var(--accent-l);
      font-weight: 500; margin: 4px 0 12px; letter-spacing: 0.04em;
    }
    .team-bio { font-size: 13.5px; color: var(--muted); line-height: 1.65; }
    .team-overlay {
      position: absolute; inset: 0;
      background: rgba(6,9,14,0.97);
      padding: 32px 28px;
      display: flex; flex-direction: column; justify-content: center;
      opacity: 0; transition: opacity 0.26s;
    }
    .team-overlay-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px; font-weight: 700;
      color: var(--accent-l); margin-bottom: 12px;
    }
    .team-overlay p { font-size: 13.5px; color: var(--text); line-height: 1.72; }

    /* ── PARTNERS ── */
    .partners-section {
      padding: 56px 0 60px;
      background: #ffffff;
      overflow: hidden;
    }
    .partners-label {
      text-align: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11.5px; font-weight: 600;
      letter-spacing: 0.24em; color: #4a5d6e;
      text-transform: uppercase; margin-bottom: 40px;
    }
    .logo-scroll { overflow: hidden; position: relative; }
    .logo-track {
      display: flex; align-items: center; gap: 76px;
      width: max-content;
      animation: scroll-logos 40s linear infinite;
    }
    .logo-track:hover { animation-play-state: paused; }
    .logo-track img {
      height: 58px; opacity: 1;
      max-width: 220px;
      transition: transform 0.2s;
      flex-shrink: 0; object-fit: contain;
    }
    .logo-track img:hover { transform: translateY(-2px); }
    @keyframes scroll-logos {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ── CONTACT ── */
    .contact-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 80px; align-items: start;
    }
    .contact-email { font-size: 15px; color: var(--accent-l); margin-top: 22px; }
    .cta-cards { display: flex; flex-direction: column; gap: 16px; }
    .cta-card {
      background: var(--surface); border: 1px solid var(--border);
      padding: 30px 32px; border-radius: 3px;
      display: flex; flex-direction: column; gap: 10px;
      transition: border-color 0.2s;
    }
    .cta-card:hover { border-color: var(--accent-d); }
    .cta-card-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px; font-weight: 700; color: #fff;
    }
    .cta-card-desc { font-size: 14px; color: var(--muted); line-height: 1.6; }
    .cta-card .btn-primary,
    .cta-card .btn-ghost { align-self: flex-start; margin-top: 6px; font-size: 14px; padding: 10px 24px; }

    /* ── PAGE HEADER (inner pages) ── */
    .page-header {
      padding: 140px 64px 72px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      position: relative; overflow: hidden;
    }
    .page-header.underground {
      background-image: url("assets/hero_underground2.png");
      background-size: cover; background-position: center 40%;
    }
    .page-header.underground::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(105deg, rgba(4,8,14,0.91) 50%, rgba(4,8,14,0.55) 100%);
      pointer-events: none;
    }
    .page-header.space {
      background-image: url("assets/hero_space.jpg");
      background-size: cover; background-position: center center;
    }
    .page-header.space::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(105deg, rgba(4,8,14,0.88) 50%, rgba(4,8,14,0.55) 100%);
      pointer-events: none;
    }
    .page-header:not(.underground):not(.space)::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 70% 50%, rgba(74,143,181,0.06), transparent);
      pointer-events: none;
    }
    .page-header .eyebrow { margin-bottom: 16px; position: relative; z-index: 1; }
    .page-header .sec-title { font-size: clamp(36px,5vw,64px); margin-bottom: 0; position: relative; z-index: 1; }

    /* ── ABOUT PAGE ── */
    .about-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 80px; align-items: start;
    }
    .about-quote {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px; font-weight: 600;
      color: #fff; line-height: 1.25;
      border-left: 3px solid var(--accent);
      padding-left: 28px; margin: 48px 0;
    }
    .timeline { margin-top: 48px; }
    .tl-item {
      display: grid; grid-template-columns: 28px 1fr;
      gap: 20px; margin-bottom: 32px; align-items: start;
    }
    .tl-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent); margin-top: 6px;
      box-shadow: 0 0 0 4px rgba(74,143,181,0.15);
    }
    .tl-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px; font-weight: 600; letter-spacing: 0.12em;
      color: var(--accent); text-transform: uppercase; margin-bottom: 4px;
    }
    .tl-body { font-size: 15px; color: var(--muted); line-height: 1.65; }

    /* ── SOLUTIONS PAGE ── */
    .use-case-grid {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 2px; margin-top: 48px;
    }
    .use-case-card {
      background: var(--surface); padding: 36px 28px;
      border-top: 2px solid var(--accent-d);
      transition: border-top-color 0.2s;
    }
    .use-case-card:hover { border-top-color: var(--accent); }
    .use-case-icon { width: 32px; height: 32px; color: var(--accent); margin-bottom: 16px; }
    .use-case-card h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 10px;
    }
    .use-case-card p { font-size: 14px; color: var(--muted); line-height: 1.65; }

    /* ── FOOTER ── */
    .footer {
      background: var(--bg); border-top: 1px solid var(--border);
      padding: 36px 64px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-logo img { height: 20px; width: auto; opacity: 0.6; }
    .footer-copy { font-size: 12.5px; color: var(--muted); }
    .footer-links { display: flex; gap: 24px; }
    .footer-links a { font-size: 12.5px; color: var(--muted); text-decoration: none; cursor: pointer; transition: color 0.2s; }
    .footer-links a:hover { color: #fff; }
    .footer-social { display: flex; gap: 16px; align-items: center; }
    .footer-social a { color: var(--muted); transition: color 0.2s; display: flex; }
    .footer-social a:hover { color: #fff; }
    .footer-social svg { width: 18px; height: 18px; }
    .footer-right { display: flex; flex-direction: column; align-items: flex-end; gap: 18px; }

    /* ── DEFINITION BLOCK (TerraSpace lexicon) ── */
    .def-wrap { background: var(--surface); border-left: 3px solid var(--accent); padding: 48px 52px; margin-top: 8px; }
    .def-block { display: grid; grid-template-columns: repeat(3,1fr); gap: 48px; }
    .def-term { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700; color: #fff; line-height: 1; }
    .def-phon { font-family: 'Barlow', sans-serif; font-size: 14.5px; color: var(--muted); margin: 8px 0 2px; }
    .def-pos { font-family: 'Barlow Condensed', sans-serif; font-size: 11.5px; color: var(--accent); letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; margin-bottom: 14px; }
    .def-text { font-size: 15px; color: var(--text); line-height: 1.62; }
    .def-ours .def-term { color: var(--accent-l); }
    .def-ours { padding: 22px 24px; background: rgba(74,143,181,0.07); border: 1px solid var(--accent-d); border-radius: 4px; align-self: start; }

    /* ── FEATURED IN ── */
    .featured-section { padding: 72px 64px; background: #ffffff; }
    .featured-label { text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: 0.24em; color: #4a5d6e; text-transform: uppercase; margin-bottom: 42px; }
    .featured-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 28px 60px; max-width: 1080px; margin: 0 auto; }
    .featured-item { text-decoration: none; opacity: 1; transition: opacity 0.2s; line-height: 1; }
    .featured-item:hover { opacity: 0.75; }
    .featured-item img { width: auto; display: block; }
    .featured-scroll { overflow: hidden; position: relative; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
    .featured-track { display: flex; align-items: center; gap: 72px; width: max-content; animation: scroll-logos 46s linear infinite; }
    .featured-scroll:hover .featured-track { animation-play-state: paused; }

    /* ── SOVEREIGNTY BAND ── */
    .sov-band { padding: 96px 64px; text-align: center; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); position: relative; }
    .sov-inner { max-width: 920px; margin: 0 auto; position: relative; z-index: 1; }
    .sov-head { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(30px,4vw,52px); font-weight: 700; line-height: 1.06; color: #fff; }
    .sov-head em { font-style: normal; color: var(--accent-l); }
    .sov-body { font-size: 17px; color: var(--text); line-height: 1.72; margin-top: 24px; max-width: 720px; margin-left: auto; margin-right: auto; }

    /* ── PLACEHOLDER IMAGERY ── */
    .placeholder { position: relative; width: 100%; border-radius: 4px; overflow: hidden; background-color: var(--surface); background-image: repeating-linear-gradient(135deg, rgba(106,175,212,0.07) 0 11px, transparent 11px 22px); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; min-height: 220px; }
    .placeholder span { font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 12px; color: var(--muted); letter-spacing: 0.03em; text-align: center; padding: 16px 20px; max-width: 80%; line-height: 1.55; }

    /* ── SOLUTIONS OVERVIEW ── */
    .sol-overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-top: 52px; }
    .sol-ov-card { background: var(--surface); display: flex; flex-direction: column; text-decoration: none; border-top: 2px solid var(--accent-d); transition: border-top-color 0.2s; }
    .sol-ov-card:hover { border-top-color: var(--accent); }
    .sol-ov-media { width: 100%; aspect-ratio: 16/10; overflow: hidden; background: var(--bg2); }
    .sol-ov-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sol-ov-body { padding: 32px 34px 38px; }
    .sol-ov-kicker { font-family: 'Barlow Condensed', sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: 0.18em; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
    .sol-ov-card h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 10px; }
    .sol-ov-card p { font-size: 14.5px; color: var(--muted); line-height: 1.66; margin-bottom: 18px; }
    .sol-ov-link { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-l); }

    /* ── OFFERINGS LIST ── */
    .offer-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 2px; margin-top: 8px; }
    .offer-card { background: var(--surface); padding: 32px 30px; }
    .offer-card h4 { font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 700; color: #fff; margin-bottom: 9px; display: flex; align-items: center; gap: 10px; }
    .offer-card h4 .offer-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .offer-card p { font-size: 14px; color: var(--muted); line-height: 1.62; }

    /* ── COMPARE TABLE ── */
    .compare { margin-top: 52px; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .compare-row { display: grid; grid-template-columns: 1.1fr 1fr 1fr; }
    .compare-row > div { padding: 18px 24px; border-bottom: 1px solid var(--border); font-size: 14.5px; }
    .compare-row:last-child > div { border-bottom: none; }
    .compare-head > div { background: var(--surface2); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-size: 14px; color: #fff; }
    .compare-row > div:first-child { color: var(--muted); font-weight: 500; background: var(--bg2); }
    .compare-row > div:not(:first-child) { color: var(--text); border-left: 1px solid var(--border); }
    .compare-head > div:first-child { color: var(--accent); }

    /* ── NEWS ── */
    .news-list { display: flex; flex-direction: column; margin-top: 8px; }
    .news-item { display: grid; grid-template-columns: 140px 1fr 24px; gap: 28px; align-items: baseline; padding: 26px 4px; border-bottom: 1px solid var(--border); text-decoration: none; transition: padding-left 0.2s; }
    .news-item:hover { padding-left: 12px; }
    .news-item:hover .news-title { color: #fff; }
    .news-item:hover .news-arrow { color: var(--accent-l); }
    .news-date { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.1em; color: var(--accent); text-transform: uppercase; white-space: nowrap; }
    .news-outlet { font-size: 12px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
    .news-title { font-family: 'Barlow Condensed', sans-serif; font-size: 21px; font-weight: 600; color: var(--text); line-height: 1.26; transition: color 0.2s; }
    .news-arrow { color: var(--muted); transition: color 0.2s; font-size: 18px; }

    /* ── IEA DATA BLOCK ── */
    .iea-block { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 42px 46px; margin: 52px 0; }
    .iea-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 52px; }
    .iea-chart-title { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .iea-chart-sub { font-size: 12.5px; color: var(--dim); margin-bottom: 20px; }
    .iea-row { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 12px; margin-bottom: 12px; }
    .iea-row-label { font-size: 13px; color: var(--muted); text-align: right; }
    .iea-bar-track { height: var(--iea-bar-h, 18px); background: var(--bg2); border-radius: 2px; overflow: hidden; }
    .iea-bar { height: 100%; background: linear-gradient(90deg, var(--accent-d), var(--iea-bar-color, var(--accent))); transform-origin: left center; }
    html[data-iea-style="solid"] .iea-bar { background: var(--iea-bar-color, var(--accent)); }
    html[data-iea-frame="flat"] .iea-block { background: transparent; border-color: transparent; padding-left: 0; padding-right: 0; }
    html[data-iea-notes="off"] .iea-note { display: none; }
    /* chart entrance animation */
    html[data-iea-anim="grow"] .iea-bar {
      transition: transform var(--iea-anim-dur, 0.9s) cubic-bezier(0.22,1,0.36,1);
      transition-delay: calc(var(--iea-i, 0) * var(--iea-stagger, 0s));
    }
    @media (prefers-reduced-motion: no-preference) {
      html[data-iea-anim="grow"] .iea-block:not(.iea-in) .iea-bar { transform: scaleX(0); }
    }
    /* vision pillar entrance */
    .pillar-grid .use-case-card { transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22,1,0.36,1); }
    .pillar-grid .use-case-card:nth-child(2) { transition-delay: 0.1s; }
    .pillar-grid .use-case-card:nth-child(3) { transition-delay: 0.2s; }
    @media (prefers-reduced-motion: no-preference) {
      .pillar-grid:not(.in-view) .use-case-card { opacity: 0; transform: translateY(22px); }
    }
    .iea-row-val { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; color: var(--accent-l); }
    /* interactive chart rows */
    .iea-row { cursor: default; }
    .iea-row:hover .iea-bar { filter: brightness(1.35); }
    .iea-row:hover .iea-row-label { color: #fff; }
    .iea-row:hover .iea-row-val { color: #fff; }
    .iea-usgs { margin-top: 44px; border-top: 1px solid var(--border); padding-top: 34px; }
    .iea-usgs .iea-row { grid-template-columns: 168px 1fr 44px; margin-bottom: 9px; }
    .iea-usgs .iea-bar-track { background: var(--bg2) repeating-linear-gradient(90deg, rgba(255,255,255,0.07) 0 1px, transparent 1px 25%); }
    .iea-axis { display: grid; grid-template-columns: 168px 1fr 44px; gap: 12px; margin-top: 8px; }
    .iea-axis-inner { position: relative; height: 15px; }
    .iea-axis-tick { position: absolute; top: 0; transform: translateX(-50%); font-size: 11px; color: var(--dim); }

function IeaBlock() {

    const el = ref.current;

    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { el.classList.add("iea-in"); io.disconnect(); } });
    }, { threshold: 0.2 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (

// ── APP ──────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "chartBarStyle": "Gradient",
  "chartBarColor": "#2f6f94",
  "chartBarHeight": 18,
  "chartFrame": "Card",
  "chartNotes": true,
  "chartAnim": "Grow",
  "chartAnimSpeed": 0.9,
  "chartStagger": true
}/*EDITMODE-END*/;

// Resilient to the external tweaks-panel.jsx fetch failing/lagging (rare Babel race):
// captured ONCE at eval time so the hook identity never changes mid-session.
const useTweaksResilient = window.useTweaks || function(defaults) {
  const [tweaks, setTweaks] = React.useState(defaults);
  const setTweak = (k, v) => setTweaks(p => ({ ...p, ...(typeof k === "object" ? k : { [k]: v }) }));
  return [tweaks, setTweak];
};

function App() {
  const [page, setPage] = useState("home");
  const [scrolled, setScrolled] = useState(false);
  const topRef = useRef(null);
  const [tw, setTweak] = useTweaksResilient(TWEAK_DEFAULTS);

  useEffect(() => {
    const root = document.documentElement;
    root.style.setProperty("--iea-bar-color", tw.chartBarColor);
    root.style.setProperty("--iea-bar-h", tw.chartBarHeight + "px");
    root.dataset.ieaStyle = tw.chartBarStyle === "Solid" ? "solid" : "gradient";
    root.dataset.ieaFrame = tw.chartFrame === "Flat" ? "flat" : "card";
    root.dataset.ieaNotes = tw.chartNotes ? "on" : "off";
    root.dataset.ieaAnim = tw.chartAnim === "Off" ? "off" : "grow";
    root.style.setProperty("--iea-anim-dur", tw.chartAnimSpeed + "s");
    root.style.setProperty("--iea-stagger", tw.chartStagger ? "0.14s" : "0s");
  }, [tw]);

  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 56);
    window.addEventListener("scroll", h, { passive: true });
    return () => window.removeEventListener("scroll", h);
  }, []);

  function goTo(p) {
    setPage(p);
    // scroll to top of page
    window.scrollTo({ top: 0 });
  }

  return (
    <div ref={topRef}>
      <Nav page={page} goTo={goTo} scrolled={scrolled} />
      {page === "home"      && <HomePage goTo={goTo} />}
      {page === "about"     && <AboutPage goTo={goTo} />}
      {page === "team"      && <TeamPage goTo={goTo} />}
      {page === "solutions" && <SolutionsOverviewPage goTo={goTo} />}
      {page === "smartscan" && <SmartScanPage goTo={goTo} />}
      {page === "lodestar"  && <LodestarPage goTo={goTo} />}
      {page === "news"      && <NewsPage goTo={goTo} />}
      {page === "contact"   && <ContactPage goTo={goTo} />}

      {window.TweaksPanel ? (
      <TweaksPanel>
        <TweakSection label="About · Charts" />
        <TweakRadio label="Bar style" value={tw.chartBarStyle} options={["Gradient","Solid"]} onChange={v => setTweak('chartBarStyle', v)} />
        <TweakColor label="Bar color" value={tw.chartBarColor} options={["#4a8fb5","#6aafd4","#2f6f94"]} onChange={v => setTweak('chartBarColor', v)} />
        <TweakSlider label="Bar height" value={tw.chartBarHeight} min={10} max={26} unit="px" onChange={v => setTweak('chartBarHeight', v)} />
        <TweakRadio label="Frame" value={tw.chartFrame} options={["Card","Flat"]} onChange={v => setTweak('chartFrame', v)} />
        <TweakToggle label="Footnotes" value={tw.chartNotes} onChange={v => setTweak('chartNotes', v)} />
        <TweakRadio label="Animation" value={tw.chartAnim} options={["Off","Grow"]} onChange={v => setTweak('chartAnim', v)} />
        <TweakSlider label="Speed" value={tw.chartAnimSpeed} min={0.3} max={1.6} step={0.1} unit="s" onChange={v => setTweak('chartAnimSpeed', v)} />
        <TweakToggle label="Stagger" value={tw.chartStagger} onChange={v => setTweak('chartStagger', v)} />
      </TweaksPanel>
      ) : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
